# Default settings. Copy to config/local.yaml and pass --config to override.
# Run `eyetrack probe` first to find the real camera indices and supported modes.

eye_camera:
  index: 0              # OV9281 (mono, global shutter, no IR filter)
  width: 640            # 640x400: full 1280x800 view at half scale, the pixel scale the pupil settings were tuned at
  height: 400
  fps: 120              # requested; probe reports what macOS actually delivers
  fourcc: MJPG          # high-fps modes usually need MJPG over USB 2
  exposure: null        # null = leave camera default; AVFoundation ignores this, use uvc below
  uvc:                  # set over USB with libusb (capture/uvc.py); remove this block for other cameras
    vendor_id: 0x0c45   # U20CAM-9281M (Sonix); see `system_profiler SPUSBDataType`
    product_id: 0x636d
    exposure_ms: 8      # manual exposure. Auto exposure goes past 8.3 ms in dim IR and the camera drops
                        # to 30 fps. null = leave the camera's own setting
    gain: null          # 0-64 (camera default 15). The U20CAM-9281M accepts it but the image doesn't change
                        # (15 vs 64 identical, 2026-11-01), so add LED light instead
  flip: false           # set true if the camera is mounted upside down
  watchdog_min_fps: 100 # below this for 2 s: re-send the uvc controls, then reopen the camera. The camera has
                        # stuck at 30 fps until reopened (2026-11-01). 100 = the `validate` alignment check.
                        # null = off
  mirror_preview: true  # show the eye mirrored, like Photo Booth; recordings and results are unchanged

scene_camera:
  index: 1              # GC0308 (cover/disable its IR LEDs when used as scene cam)
  width: 640
  height: 480
  fps: 30
  fourcc: MJPG
  exposure: null
  flip: false

recording:
  output_dir: data
  eye_codec: MJPG       # near-lossless and cheap to encode at high fps
  scene_codec: MJPG

realtime:
  # Process every eye frame live (detection + causal validity / blink / saccade flags) on a worker
  # decoupled from the preview, and save live_pupil.csv, live_blinks.csv, live_summary.json in the
  # session. `eyetrack process` still recomputes everything offline from eye.avi. See docs/realtime.md.
  enabled: true
  backend: thread       # thread | process (both keep up at 120 fps on an M3; thread has lower latency)
  queue_frames: 240     # 2 s of frames; when full, frames are skipped by the live path only (and counted)
  late_ms: 25           # results later than this after capture are counted as late
  flush_rows: 60        # flush live_pupil.csv every ~0.5 s so a crash loses little
  eye_model: null       # session folder / metrics_summary.json from `eyetrack process`: live yaw/pitch in deg

pupil:
  roi: null             # [x, y, w, h] in eye-camera pixels to ignore eyelashes/frame; null = full image
  threshold_offsets: [5, 15, 25]   # strict / medium / relaxed, added to darkest pixel value
  search_box: 250       # px square around the darkest point that is searched for the pupil
  min_area: 300         # px^2; JEO uses 1000 at 640x480 – lower for small pupils at 640x400
  max_aspect: 3.0
  # Validated on LPW (real IR eye video, 640x400 crop, held-out participants): the original
  # single-seed detector was as accurate as any tuned variant on normal footage and 3-10x faster.
  # For make-up / glasses footage try n_seeds: 5, score: shape, block: 30 (participant 22: 14% -> 72%).
  n_seeds: 1            # dark candidate regions tried
  score: jeo            # "jeo" or "shape"
  block: 20
  # Bias against dark regions at the image border (glasses frame, hair): grey levels added to the darkest-block
  # search at the edge, fading to 0 at edge_margin x width/height inward. LPW at 5 px: tune half 66.9% -> 67.8%
  # (flat from 10 to 20), held-out 78.0% -> 78.0%, wrong among accepted 3.9% -> 4.0%. 0 = off
  edge_penalty: 10
  edge_margin: 0.2
  # The pupil centre must be inside this box ([x0, y0, x1, y1] as fractions of the eye image), the same box the
  # `validate` alignment screen asks you to put the pupil in. The image isn't cropped, so the outline can cross it.
  # Re-processing the 2026-11-01 validate session: valid 89.5% -> 97.9%, jumps > 60 px 175 -> 4 (the rest were hair
  # and frame at the image edge). Ignored by `eyetrack benchmark lpw`, whose videos aren't aligned to it. null = off
  search_zone: [0.25, 0.20, 0.75, 0.80]
  # Surround check: score candidates by how many of 8 directions around them are >= surround_margin grey levels
  # brighter than the inside (a pupil is ringed by iris; hair or the frame edge isn't). LPW at 5 px with
  # surround: 2: tune 67.8% -> 68.3%, held-out 78.0% -> 78.2%. On the 2026-11-01 session it adds nothing with
  # search_zone on (97.9% valid, 4 jumps either way). Without the zone, n_seeds: 3 + surround: 2 gets 97.9% valid
  # and 71 jumps (vs 89.5% / 175). Off by default; ~0.4 ms per frame. 0 = off
  surround: 0
  surround_margin: 10
  glint_kernel: 0       # grey opening to erase glints (did not help on LPW)
  median_blur: 0
  refine: angle         # angle | hull | none | visible (fit and score only the outline next to the iris,
                        # not the part along a reflection; same accuracy, more frames above a given confidence)
  method: threshold     # threshold (JEO-based) | edge (Pupil Labs-style edge + RANSAC fit; less robust on LPW)
  # LPW held-out: conf>=0.5 + size filter keeps 88% of frames with 3.1% wrong (>10 px);
  # the old 0.6 kept 85% at the same error and dropped twice as many correct frames
  min_confidence: 0.5   # frames below this are treated as missing (blink / bad detection)
  max_size_ratio: 1.5   # drop frames whose diameter jumps >1.5x vs the 2 s rolling median (iris picked)

eye_model:
  # Eyeball radius in eye-image pixels. It sets degrees per pixel for gaze angles, saccade sizes and speeds.
  # null = fit it per session from the pupil ellipses. On one build (2026-10/11) fitted radii ranged
  # 53-218 px; the 53 px fit made 1 px of jitter read as 1.3 deg and labelled 33% of frames as saccades.
  # With a fixed camera mount the radius is a property of the hardware: measure it once with
  # `eyetrack validate --only targets` and set it in config/local.yaml. The center is always fitted.
  radius_px: null
  plausible_radius: [1.5, 6.0]   # warn when radius / median pupil diameter falls outside this range
  # When a fitted radius is outside plausible_radius (and radius_px isn't set), use this many median pupil
  # diameters instead, so one bad fit can't turn pixel jitter into saccades. On this build, fits that passed
  # were 2.4-3.3x the pupil diameter (5 sessions, Oct-Nov 2026); the failed 2026-11-02 fit was 0.9x. Re-running
  # that session at 120-160 px (2.1-2.8x) gave reading 2.8-3.0 saccades/s and 12-13% saccade frames either way.
  # null = keep the bad fit and only warn
  fallback_ratio: 2.7

screen:
  # Physical size and viewing distance, used to turn `targets` positions into visual angles.
  width_cm: null        # visible width of the display; required for the targets measurement
  distance_cm: 57       # eye to screen; at 57 cm, 1 cm on screen is about 1 deg

blinks:
  # brightness: blink vs dropout from image brightness (eye area brighter = eyelid; whole frame darker =
  # lighting / screen flicker), independent of the pupil detector. confidence: the older rule below.
  method: brightness
  lighting_drop: 0.08   # whole frame >= 8% darker than just before -> lighting dropout, not a blink
  eyelid_rise: 3.0      # eye area >= 3 grey levels brighter than just before -> eyelid (blink / closed)
  # tuned on Lund2013 at 120 Hz: merging valid flickers < 80 ms raised blink F1 0.86 -> 0.96
  min_duration_ms: 30
  max_duration_ms: 500
  merge_gap_ms: 80
  # a dropout whose median confidence stays above this is glare/reflection, not a blink.
  # NOT validated on labelled data yet (LPW has no blink labels) - check with the cued-blink test.
  max_blink_confidence: 0.35
  pad_ms: 25           # samples around a blink that are also dropped (eyelid partly closed)

events:
  # ivt: velocity threshold (below). step: an edge filter of medians that finds saccades as steps between
  # fixations; it rides over short dropouts (e.g. screen flicker), which I-VT can't. Lund2013 at 120 Hz:
  # F1 0.84 / 0.81 at 0.2 / 0.5 deg noise (I-VT 0.86 / 0.76); see docs/benchmarks.md
  method: ivt
  step:
    half_window_ms: 60            # median window on each side; saccades closer than ~2x this merge
    noise_factor: 8               # a step must exceed 8 x the noise of a window median
    min_amplitude: 1.0            # deg
    min_amplitude_px: 2.0         # used when there is no eye model
    min_separation_ms: 120
  # I-VT tuned on Lund2013 resampled to 120 Hz (`eyetrack benchmark lund`): a fixed 30 deg/s
  # threshold plus rejecting candidates smaller than 3x the measured noise (RMS-S2S) beat
  # the Nyström-Holmqvist adaptive threshold, which missed small saccades at 120 Hz.
  velocity_threshold: 30          # deg/s, or "adaptive"
  min_threshold: 30               # deg/s floor when adaptive
  adaptive_k: 6
  amplitude_noise_factor: 3       # drop saccades with amplitude < 3 x RMS-S2S noise
  min_amplitude: 0                # deg, absolute amplitude floor
  velocity_threshold_px: 400      # used when no eye model: pupil px/s on the eye image
  min_saccade_ms: 10
  min_fixation_ms: 60
  smoothing_ms: 20                # Savitzky-Golay window; no effect below 5 samples (i.e. at 120 Hz)
  merge_gap_ms: 0                 # join saccades split by post-saccadic wobble (did not help on Lund)
  # Lund2013 at 120 Hz, 0.15 deg noise (see docs/benchmarks.md): filling gaps of up to 4 frames restores
  # F1 with 5% lost frames (0.85 -> 0.92, image viewing); the 1-sample correction moves the median
  # duration error from +9 ms to +1 ms. Both are I-VT only.
  fill_gap_ms: 35                 # interpolate runs of missing samples up to this long (4 frames at 120 Hz)
  duration_bias_samples: 1        # subtract 1 sample interval from saccade durations
  # Glitches and saccades hidden by glare (2026-11-03). Lund2013 at 120 Hz, tuned on image viewing, reported on
  # held-out video + dots, 3 noise draws; `eyetrack benchmark lund --loss saccade` loses tracking around 30% of
  # saccades for 30-150 ms, as glare does on this build. Held-out F1 at 0.2 / 0.5 deg noise:
  #   no loss:        0.789 / 0.624 -> 0.784 / 0.628 (precision 0.80 / 0.67 -> 0.83 / 0.81)
  #   saccade loss:   0.617 / 0.469 -> 0.718 / 0.590
  # persist_ratio: a candidate must leave the eye at least this share of its amplitude away from where it started
  # (medians over persist_ms either side). Rejects out-and-back detector glitches. 0.3 and 0.5 tie on the tuning
  # half, 0.7 loses real saccades. 0 = off
  persist_ratio: 0.5
  persist_ms: 50
  # bridge_gap_ms: a tracking gap up to this long counts as a saccade if the eye ends up far enough away to have
  # moved at >= velocity_threshold on average. Blinks are never bridged. 100 / 150 / 200 ms gave tuning F1
  # 0.81 / 0.85 / 0.86 with saccade loss; 200 only wins on gaps at the edge of the simulation, and longer real
  # gaps often hide more than one saccade, so 150. 0 = off
  bridge_gap_ms: 150

pupil_size:
  smoothing_ms: 50
  baseline_ms: 500
  # markers that start a baseline-corrected epoch (pupil_epochs.csv); each epoch runs to the next marker
  epoch_labels: [lights_off, lights_on, task_start, task_end, marker]
  epoch_max_s: 30
  epoch_end_ignore: [solved]      # markers that don't end an epoch (SPACE when an arithmetic problem is solved)

digit_span:
  # How the digit-span response is measured (protocol.py, span_responses). Standard pupillometry choices, not tuned
  # on any session: untrusted frames removed (invalid, size jumps, centre > off_track_px from the local track),
  # gaps up to interpolate_max_ms filled, a zero-phase low-pass at lowpass_hz (a task-evoked response lasts
  # seconds), a median baseline over baseline_s, and the response subtracted in px (Mathot et al. 2018).
  # Trials with less than min_usable of their baseline or window usable are dropped and counted.
  baseline_s: 1.0
  lowpass_hz: 4
  interpolate_max_ms: 250
  min_usable: 0.8
  off_track_px: 25

calibration:
  aruco_dict: DICT_4X4_50
  poly_degree: 2
  scene_hfov_deg: 60              # GC0308 horizontal field of view, used to convert px error to degrees
