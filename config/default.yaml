# Default settings. Copy to config/local.yaml and pass --config to override.
# Run `eyetrack probe` first to find the real camera indices and supported modes.

eye_camera:
  index: 0              # OV9281 (mono, global shutter, no IR filter)
  width: 640            # 640x400: full 1280x800 view at half scale, the pixel scale the pupil settings were tuned at
  height: 400
  fps: 120              # requested; probe reports what macOS actually delivers
  fourcc: MJPG          # high-fps modes usually need MJPG over USB 2
  exposure: null        # null = leave camera default; AVFoundation often ignores this
  flip: false           # set true if the camera is mounted upside down

scene_camera:
  index: 1              # GC0308 (cover/disable its IR LEDs when used as scene cam)
  width: 640
  height: 480
  fps: 30
  fourcc: MJPG
  exposure: null
  flip: false

recording:
  output_dir: data
  eye_codec: MJPG       # near-lossless and cheap to encode at high fps
  scene_codec: MJPG

pupil:
  roi: null             # [x, y, w, h] in eye-camera pixels to ignore eyelashes/frame; null = full image
  threshold_offsets: [5, 15, 25]   # strict / medium / relaxed, added to darkest pixel value
  search_box: 250       # px square around the darkest point that is searched for the pupil
  min_area: 300         # px^2; JEO uses 1000 at 640x480 – lower for small pupils at 640x400
  max_aspect: 3.0
  # Validated on LPW (real IR eye video, 640x400 crop, held-out participants): the original
  # single-seed detector was as accurate as any tuned variant on normal footage and 3-10x faster.
  # For make-up / glasses footage try n_seeds: 5, score: shape, block: 30 (participant 22: 14% -> 72%).
  n_seeds: 1            # dark candidate regions tried
  score: jeo            # "jeo" or "shape"
  block: 20
  glint_kernel: 0       # grey opening to erase glints (did not help on LPW)
  median_blur: 0
  refine: angle         # angle | hull | none
  # LPW held-out: conf>=0.5 + size filter keeps 88% of frames with 3.1% wrong (>10 px);
  # the old 0.6 kept 85% at the same error and dropped twice as many correct frames
  min_confidence: 0.5   # frames below this are treated as missing (blink / bad detection)
  max_size_ratio: 1.5   # drop frames whose diameter jumps >1.5x vs the 2 s rolling median (iris picked)

blinks:
  # tuned on Lund2013 at 120 Hz: merging valid flickers < 80 ms raised blink F1 0.86 -> 0.96
  min_duration_ms: 30
  max_duration_ms: 500
  merge_gap_ms: 80
  # a dropout whose median confidence stays above this is glare/reflection, not a blink.
  # NOT validated on labelled data yet (LPW has no blink labels) - check with the cued-blink test.
  max_blink_confidence: 0.35
  pad_ms: 25           # samples around a blink that are also dropped (eyelid partly closed)

events:
  # I-VT tuned on Lund2013 resampled to 120 Hz (`eyetrack benchmark lund`): a fixed 30 deg/s
  # threshold plus rejecting candidates smaller than 3x the measured noise (RMS-S2S) beat
  # the Nyström-Holmqvist adaptive threshold, which missed small saccades at 120 Hz.
  velocity_threshold: 30          # deg/s, or "adaptive"
  min_threshold: 30               # deg/s floor when adaptive
  adaptive_k: 6
  amplitude_noise_factor: 3       # drop saccades with amplitude < 3 x RMS-S2S noise
  min_amplitude: 0                # deg, absolute amplitude floor
  velocity_threshold_px: 400      # used when no eye model: pupil px/s on the eye image
  min_saccade_ms: 10
  min_fixation_ms: 60
  smoothing_ms: 20                # Savitzky-Golay window; no effect below 5 samples (i.e. at 120 Hz)
  merge_gap_ms: 0                 # join saccades split by post-saccadic wobble (did not help on Lund)

pupil_size:
  smoothing_ms: 50
  baseline_ms: 500
  # markers that start a baseline-corrected epoch (pupil_epochs.csv); each epoch runs to the next marker
  epoch_labels: [lights_off, lights_on, task_start, task_end, marker]
  epoch_max_s: 30

calibration:
  aruco_dict: DICT_4X4_50
  poly_degree: 2
  scene_hfov_deg: 60              # GC0308 horizontal field of view, used to convert px error to degrees
